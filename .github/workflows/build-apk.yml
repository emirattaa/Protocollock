name: build-apk
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build (proje kökünü otomatik bulur)
        run: |
          D=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")
          cd "$D"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: astro-apk, path: "**/build/outputs/apk/debug/app-debug.apk" }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: "**/build/outputs/apk/debug/app-debug.apk"
